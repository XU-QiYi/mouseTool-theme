[package]
name = "mousetool-theme"
version = "0.4.0"
description = "Windows 光标主题管理工具：导入 / 应用 / 备份第三方光标包，无需管理员权限"
authors = ["XU-QiYi"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mousetool_theme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：关闭到托盘的托盘图标；image-png：托盘图标的 PNG 解码（Image::from_bytes）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
image = "0.25"
base64 = "0.22"
zip = "2"
# .themepack 是 CAB 容器（决策 39）：cab 是纯 Rust 读取器，手写 CAB + MSZIP
# 解档的成本与安全面都不划算，理由见决策记录「决策 39」
cab = "0.6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri-plugin-dialog = "2"

[dev-dependencies]
# 测试临时目录：Drop 即清理，见决策 27（锁文件已有该版本，不新增供应链）
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }

