name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # 先出 dist：tauri-build 在 cargo test 前会检查前端产物
      - name: Build frontend
        run: npm run build

      # 工具链钉到具体版本，不用 @stable。下面 clippy 的口径是「警告基线为零」，
      # 而 @stable 会随 Rust 发版漂移，于是 CI 红不红取决于哪天跑的、撞上哪个
      # clippy，而不是这次改了什么 —— 2026-10-29 一个新 lint
      # (chunks_exact_to_as_chunks) 就把 5 处早就在库里的代码全打成红，
      # 把在途 PR 白白拦下。升级时主动改这里，一次把新 lint 结清。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 注册表用例只写 HKCU 下的隔离键，光标 fixture 由代码生成：
      # CI 不需要系统里存在某个光标文件，也不会改动运行机器的光标设置
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # clippy 警告基线是零：新 lint 仍然会拦，但因为工具链钉死了，只会在
      # 主动升级上面那个版本时集中冒出来，不会挑在途 PR 动手的时候冒
      - name: Clippy deny warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 两条静态检查都不需要起 dev server
      - name: Design audit
        run: node scripts/design_audit.mjs

      - name: Document reference check
        run: node scripts/doc_ref_check.mjs
